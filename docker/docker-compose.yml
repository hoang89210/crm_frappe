# Template production tham khảo cho 1 VPS.
# Image: build bằng `docker build -f Containerfile -t crm-demo:latest .`
# Không dùng image này cho môi trường dev hằng ngày.

x-backend: &backend
  image: crm-demo:latest
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  environment:
    DB_HOST: mariadb
    DB_PORT: "3306"
    REDIS_CACHE: redis-cache:6379
    REDIS_QUEUE: redis-queue:6379
    SOCKETIO_PORT: "9000"
  depends_on:
    - mariadb
    - redis-cache
    - redis-queue

services:
  mariadb:
    image: mariadb:10.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-cache:/data

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-queue:/data

  configurator:
    <<: *backend
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;

  backend:
    <<: *backend
    entrypoint: ["bash", "-c"]
    command:
      - >
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        exec bench serve --port 8000

  websocket:
    <<: *backend
    entrypoint: ["bash", "-c"]
    command: ["cd /home/frappe/frappe-bench && node apps/frappe/socketio.js"]

  queue-short:
    <<: *backend
    entrypoint: ["bash", "-c"]
    command: ["cd /home/frappe/frappe-bench && bench worker --queue short,default"]

  queue-long:
    <<: *backend
    entrypoint: ["bash", "-c"]
    command: ["cd /home/frappe/frappe-bench && bench worker --queue long,default,short"]

  scheduler:
    <<: *backend
    entrypoint: ["bash", "-c"]
    command: ["cd /home/frappe/frappe-bench && bench schedule"]

  frontend:
    image: frappe/nginx:version-15
    restart: unless-stopped
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "80:8080"
    depends_on:
      - backend
      - websocket

volumes:
  mariadb:
  redis-cache:
  redis-queue:
  sites:
  logs:
