services:
  mariadb:
    image: mariadb:10.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis_cache_data:/data

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis_queue_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    environment:
      DB_HOST: mariadb
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SITE_NAME: ${SITE_NAME:-crm.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      CHATWOOT_INTERNAL_URL: http://chatwoot:3000/chatwoot
      CHATWOOT_PUBLIC_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1}/chatwoot
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    entrypoint: ["bash", "/home/frappe/frappe-bench/docker-entrypoint.sh"]
    expose:
      - "8000"

  chatwoot-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD:-chatwoot}
    volumes:
      - chatwoot_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot -d chatwoot"]
      interval: 10s
      timeout: 5s
      retries: 10

  chatwoot-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - chatwoot_redis:/data

  chatwoot-init:
    image: chatwoot/chatwoot:v3.14.1
    restart: "no"
    depends_on:
      chatwoot-db:
        condition: service_healthy
      chatwoot-redis:
        condition: service_started
    environment:
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:-replace_with_long_random_string_at_least_64_chars_please_change}
      FRONTEND_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1}/chatwoot
      FORCE_SSL: "false"
      RAILS_ENV: production
      NODE_ENV: production
      POSTGRES_HOST: chatwoot-db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD:-chatwoot}
      REDIS_URL: redis://chatwoot-redis:6379
      ACTIVE_STORAGE_SERVICE: local
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    volumes:
      - chatwoot_storage:/app/storage

  chatwoot:
    image: chatwoot/chatwoot:v3.14.1
    restart: unless-stopped
    depends_on:
      chatwoot-db:
        condition: service_healthy
      chatwoot-redis:
        condition: service_started
      chatwoot-init:
        condition: service_completed_successfully
    environment:
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:-replace_with_long_random_string_at_least_64_chars_please_change}
      FRONTEND_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1}/chatwoot
      FORCE_SSL: "false"
      RAILS_ENV: production
      NODE_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      POSTGRES_HOST: chatwoot-db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD:-chatwoot}
      REDIS_URL: redis://chatwoot-redis:6379
      ACTIVE_STORAGE_SERVICE: local
      INSTALLATION_NAME: CRM Demo Chatwoot
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    volumes:
      - chatwoot_storage:/app/storage
    expose:
      - "3000"

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:v3.14.1
    restart: unless-stopped
    depends_on:
      chatwoot-db:
        condition: service_healthy
      chatwoot-redis:
        condition: service_started
      chatwoot-init:
        condition: service_completed_successfully
    environment:
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:-replace_with_long_random_string_at_least_64_chars_please_change}
      FRONTEND_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1}/chatwoot
      FORCE_SSL: "false"
      RAILS_ENV: production
      NODE_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      POSTGRES_HOST: chatwoot-db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD:-chatwoot}
      REDIS_URL: redis://chatwoot-redis:6379
      ACTIVE_STORAGE_SERVICE: local
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - chatwoot_storage:/app/storage

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - chatwoot
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mariadb_data:
  redis_cache_data:
  redis_queue_data:
  sites:
  logs:
  chatwoot_db:
  chatwoot_redis:
  chatwoot_storage:
